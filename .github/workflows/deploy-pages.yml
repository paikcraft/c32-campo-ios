name: Publicar C32 Campo iOS/PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar PWA atual
        run: |
          rm -rf site
          mkdir site
          unzip -q C32_Campo_iOS_PWA_ATUAL.zip -d site
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/service-worker.js
          test -f site/js/vendor/pdfjs/pdf.min.mjs
          test -f site/js/vendor/tesseract/tesseract.min.js
          test -f site/tessdata/por.traineddata

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
